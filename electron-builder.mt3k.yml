# MT3K Launcher: unsigned build of the controller-first launcher based on ORBIT.
#
# Same packaging as ORBIT's electron-builder.yml minus the Certum code signing
# (that key belongs to ORBIT's author). The signed Xbox Mode AppX is not produced
# here; the installer ships resources/xbox-mode and offers a Developer Mode
# registration when setup finishes (see build/installer.nsh).
#
# Compatibility with installs from before the rename is deliberate:
# appId, executableName (ORBIT.exe) and the data folder (%APPDATA%\ORBIT, pinned
# in src/main/legacyUserDataPath.ts) keep their ORBIT-era values.
#   npx electron-builder --win nsis --x64 --config electron-builder.mt3k.yml --publish never
appId: com.orbit.launcher
productName: MT3K Launcher
buildVersion: 0.1.4.0
artifactName: MT3K-Launcher-Setup-${version}-${arch}.${ext}
copyright: Copyright © 2026 MT3K. Based on ORBIT, © 2026 Luis Garcia. GPL-3.0.
forceCodeSigning: false
npmRebuild: false

publish:
  - provider: github
    owner: MondoBoricua
    repo: mt3k-launcher

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/release-manifest.mt3k.json
    to: release-manifest.json
  - from: resources/orbit-plus.mt3k.json
    to: orbit-plus.json
  - from: LICENSE
    to: LICENSE
  - from: LICENSE_EXCEPTION.md
    to: LICENSE_EXCEPTION.md
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/discord-social-sdk
    to: discord-social-sdk
  - from: resources/wallpapers
    to: wallpapers
  - from: build/xbox/AppxManifest.xml
    to: xbox-mode/AppxManifest.xml
  - from: build/xbox/CustomCapability.SCCD
    to: xbox-mode/CustomCapability.SCCD
  - from: build/appx
    to: xbox-mode/appx
  - from: scripts/windows/Register-Mt3kLauncherXboxMode.ps1
    to: xbox-mode/Register-Mt3kLauncherXboxMode.ps1

asar: true
asarUnpack:
  - node_modules/7zip-bin/**/*
  - node_modules/koffi/**/*
  - node_modules/@koromix/koffi-win32-x64/**/*
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Kept as ORBIT.exe: earlier builds, their update helper and the Xbox Mode manifest launch this name.
  executableName: ORBIT
  requestedExecutionLevel: asInvoker
  legalTrademarks: MT3K Launcher is a community gaming launcher based on ORBIT.

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - en_US
  displayLanguageSelector: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MT3K Launcher
  runAfterFinish: true
  packElevateHelper: false
  differentialPackage: false
  uninstallDisplayName: MT3K Launcher 0.1.4
  installerIcon: build/installerIcon.ico
  uninstallerIcon: build/uninstallerIcon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  include: build/installer.nsh
