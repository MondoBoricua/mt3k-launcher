name: Build Windows installer (MT3K Edition)

on:
  push:
    branches: [mt3k]
    tags: ['v*-mt3k*']
  pull_request:
    branches: [mt3k]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer, preload and main
        run: npm run build

      - name: Package unsigned NSIS installer
        run: npx electron-builder --win nsis --x64 --config electron-builder.mt3k.yml --publish never

      - name: Write SHA-256 sums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ORBIT-MT3K-windows-x64
          path: |
            release/*.exe
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ORBIT MT3K Edition ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Community build of ORBIT (fork of toonymak1993/orbit) with the MT3K Edition changes. See `CHANGELOG-MT3K.md` for what differs from the official release.

            **This installer is not code-signed.** Windows SmartScreen will warn once: click *More info* → *Run anyway*. Verify the download against `SHA256SUMS.txt` before installing.

            Not included: Xbox Mode (requires a signed AppX), automatic updates, Discord Social SDK.
          files: |
            release/*.exe
            release/latest.yml
            release/SHA256SUMS.txt
