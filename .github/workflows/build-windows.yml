name: Build Windows installer (MT3K Edition)

on:
  push:
    branches: [mt3k]
    tags: ['v*-mt3k*']
  pull_request:
    branches: [mt3k]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stamp MT3K release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/mt3k/stamp-version.mjs "${{ github.ref_name }}"

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer, preload and main
        run: npm run build

      - name: Package unsigned NSIS installer
        run: npx electron-builder --win nsis --x64 --config electron-builder.mt3k.yml --publish never

      - name: Package Xbox Mode app archive
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive -Path release/win-unpacked/* -DestinationPath "release/ORBIT-MT3K-App-$version-x64.zip" -CompressionLevel Optimal
          Get-Item release/*.zip | Select-Object Name, Length

      - name: Write SHA-256 sums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ORBIT-MT3K-windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ORBIT MT3K Edition ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Community build of ORBIT (fork of toonymak1993/orbit) with the MT3K Edition changes. See `CHANGELOG-MT3K.md` for what differs from the official release.

            **This installer is not code-signed.** Windows SmartScreen will warn once: click *More info* → *Run anyway*. Verify the download against `SHA256SUMS.txt` before installing.

            Includes ORBIT Plus (community edition) and in-app updates: ORBIT shows a prompt when a newer MT3K release is published and verifies the download against GitHub's SHA-256 digest. When setup finishes, the installer offers to register ORBIT MT3K as the Xbox Mode home app through Windows Developer Mode; Xbox Mode copies update through `ORBIT-MT3K-App-*.zip`. What changed in each version is in `CHANGELOG-MT3K.md`. Not included: the signed Xbox Mode AppX and the Discord Social SDK.
          files: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/SHA256SUMS.txt
