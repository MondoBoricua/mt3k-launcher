name: Build Windows installer (MT3K Launcher)

on:
  push:
    branches: [mt3k]
    tags: ['v*-mt3k*']
  pull_request:
    branches: [mt3k]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/mt3k/stamp-version.mjs "${{ github.ref_name }}"

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer, preload and main
        run: npm run build

      - name: Package unsigned NSIS installer
        run: npx electron-builder --win nsis --x64 --config electron-builder.mt3k.yml --publish never

      - name: Package Xbox Mode app archive
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive -Path release/win-unpacked/* -DestinationPath "release/MT3K-Launcher-App-$version-x64.zip" -CompressionLevel Optimal
          # Builds up to 0.1.4-mt3k.5 look for the ORBIT-MT3K names when they check for updates.
          Copy-Item "release/MT3K-Launcher-App-$version-x64.zip" "release/ORBIT-MT3K-App-$version-x64.zip"
          Copy-Item "release/MT3K-Launcher-Setup-$version-x64.exe" "release/ORBIT-MT3K-Setup-$version-x64.exe"
          Get-Item release/*.zip, release/*.exe | Select-Object Name, Length

      - name: Write SHA-256 sums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MT3K-Launcher-windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MT3K Launcher ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            MT3K Launcher is a controller-first game launcher for Windows, based on ORBIT by Luis Garcia (GPL-3.0). See `CHANGELOG.md` for what changed in each version.

            **This installer is not code-signed.** Windows SmartScreen will warn once: click *More info* → *Run anyway*. Verify the download against `SHA256SUMS.txt` before installing.

            Download `MT3K-Launcher-Setup-*.exe`. When setup finishes it offers to register MT3K Launcher as the Xbox Mode home app through Windows Developer Mode; Xbox Mode copies update through `MT3K-Launcher-App-*.zip`. The `ORBIT-MT3K-*` files are identical copies so builds from before the rename can still update. Plus features and in-app updates are included. Not included: a signed Xbox Mode AppX and the Discord Social SDK.
          files: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/SHA256SUMS.txt
