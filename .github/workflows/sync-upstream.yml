name: Sync upstream (toonymak1993/orbit)

# Keeps `main` an exact mirror of upstream main and opens (or refreshes) a
# pull request main -> mt3k whenever upstream publishes new commits, so the
# MT3K Edition never silently falls behind.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/toonymak1993/orbit.git
          git fetch upstream main --tags

      - name: Mirror upstream main into main
        id: mirror
        run: |
          before=$(git rev-parse origin/main)
          after=$(git rev-parse upstream/main)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main already matches upstream ($after)"
            exit 0
          fi
          git push --force origin "$after:refs/heads/main"
          git push origin --tags || true
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "main moved $before -> $after"

      - name: Open or refresh the main -> mt3k pull request
        if: steps.mirror.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summary=$(git log --oneline "${{ steps.mirror.outputs.before }}..${{ steps.mirror.outputs.after }}" | head -40)
          body=$(printf 'Upstream toonymak1993/orbit published new commits. `main` is already mirrored; merge this into `mt3k` to bring the MT3K Edition up to date.\n\n```\n%s\n```\n\nIf the merge conflicts, resolve it locally on a branch cut from `mt3k` and push it here.' "$summary")
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base mt3k --head main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh pr comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Upstream moved again: now at ${{ steps.mirror.outputs.after }}."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base mt3k --head main \
              --title "Upstream sync: toonymak1993/orbit main @ ${{ steps.mirror.outputs.after }}" \
              --body "$body"
          fi
